<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brew &amp; Co. &mdash; Order</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">&#9749; Brew &amp; Co.</div>
    <nav>
      <a href="index.html" class="active">New Order</a>
      <a href="orders.html" id="navOrderQueue" style="display: none;">Order Queue</a>
    </nav>
    <span id="modeBadge" class="badge"></span>
  </header>

  <main class="layout">
    <section>
      <h1>Menu</h1>
      <div id="filters" class="chips"></div>
      <div id="menuGrid" class="grid"><p class="empty">Loading menu&hellip;</p></div>
      
      <!-- Admin-only section -->
      <div id="adminMenuSection" style="margin-top: 2rem; display: none;">
        <h2>Add Item to Menu (Admin Only)</h2>
        <form id="addMenuItemForm" style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem;">
          <input id="itemNameInput" type="text" placeholder="Item Name" required style="padding: 0.5rem; border-radius: 6px; border: 1px solid var(--line);">
          <input id="itemPriceInput" type="number" step="0.01" placeholder="Price" required style="padding: 0.5rem; border-radius: 6px; border: 1px solid var(--line);">
          <select id="itemCategorySelect" style="padding: 0.5rem; border-radius: 6px; border: 1px solid var(--line);">
            <option value="Coffee">Coffee</option>
            <option value="Non-Coffee">Non-Coffee</option>
            <option value="Pastry">Pastry</option>
          </select>
          <button type="submit" class="btn">Add Item</button>
        </form>
      </div>
    </section>

    <aside class="panel">
      <h2>Current order</h2>
      <form id="orderForm" novalidate>
        <label for="customerName">Customer name</label>
        <input id="customerName" type="text" maxlength="60" placeholder="e.g. Ana" autocomplete="off" required>
        <div id="cartList"></div>
        <div class="total"><span>Total</span><strong id="cartTotal">&#8369;0.00</strong></div>
        <button id="placeBtn" class="btn wide" type="submit" disabled>Place order</button>
      </form>

      <!-- Customer Track Receipt Section -->
      <div id="customerReceiptSection" style="margin-top: 2rem; border-top: 1px solid var(--line); padding-top: 1.5rem; display: none;">
        <h2>My Active Orders</h2>
        <div id="receiptList"></div>
      </div>
    </aside>
  </main>

  <footer class="foot">Cafe Order Management System <span id="version"></span></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
